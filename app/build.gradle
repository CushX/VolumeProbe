plugins { id 'com.android.application' }
android {
    namespace 'com.test.volumeprobe'
    compileSdk 34
    defaultConfig {
        applicationId "com.test.volumeprobe"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
